<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#F5EDD8;font-family:'EB Garamond',Georgia,serif}
::selection{background:#B8860B44}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%,100%{opacity:.7}50%{opacity:1}}
.cross-pulse{animation:shimmer 3s ease-in-out infinite}
.reading-enter{animation:fadeIn .35s ease forwards}
button:hover{opacity:.85}
a:hover{opacity:.85}
details summary::-webkit-details-marker{display:none}

/* ── HEADER ── */
header{
  background:linear-gradient(135deg,#2D0A1E 0%,#4A1228 60%,#2D0A1E 100%);
  border-bottom:3px solid var(--sc,#B8860B);
  padding:28px 20px 22px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
header::before{
  content:'';position:absolute;inset:0;
  background-image:repeating-linear-gradient(0deg,#fff 0,#fff 1px,transparent 1px,transparent 8px);
  opacity:.06;pointer-events:none;
}
.header-cross{font-size:28px;color:var(--sc,#B8860B);margin-bottom:6px;font-family:serif}
.header-title{
  font-family:'Cinzel Decorative','Cinzel',Georgia,serif;
  font-size:clamp(20px,5vw,30px);font-weight:700;
  color:#F5EDD8;letter-spacing:.06em;line-height:1.2;
}
.header-sub{font-style:italic;font-size:15px;color:var(--sc-t,#B8860B);margin-top:6px;letter-spacing:.03em}
.season-badge{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;
  padding:4px 14px;background:var(--sc-bg,rgba(184,134,11,.2));
  border:1px solid var(--sc-border,rgba(184,134,11,.4));border-radius:20px;
  font-size:13px;color:var(--sc,#B8860B);font-family:'Cinzel',Georgia,serif;letter-spacing:.08em;
}
.season-dot{width:8px;height:8px;border-radius:50%;background:var(--sc,#B8860B)}

/* ── NAV ── */
nav{
  background:#2D0A1E;padding:14px 20px;
  display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid var(--sc-border,rgba(184,134,11,.2));
}
.nav-btn{
  width:36px;height:36px;background:transparent;
  color:var(--sc,#B8860B);border:1.5px solid var(--sc-border2,rgba(184,134,11,.4));
  border-radius:50%;cursor:pointer;font-size:13px;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.nav-date{text-align:center}
.nav-date-str{
  font-family:'Cinzel',Georgia,serif;
  font-size:clamp(13px,3vw,16px);color:#F5EDD8;letter-spacing:.04em;text-transform:capitalize;
}
.nav-date-lit{font-style:italic;font-size:14px;color:var(--sc,#B8860B);margin-top:2px}
.today-btn{
  padding:6px 14px;background:var(--sc,#B8860B);color:#fff;
  border:none;border-radius:20px;cursor:pointer;
  font-family:'Cinzel',Georgia,serif;font-size:12px;letter-spacing:.08em;
}

/* ── MAIN ── */
main{max-width:760px;margin:0 auto;padding:28px 16px 60px}
.ornament{text-align:center;margin-bottom:24px;display:flex;align-items:center;justify-content:center;gap:10px}
.ornament-line{display:inline-block;width:60px;height:2px;background:linear-gradient(to right,transparent,var(--sc,#B8860B),transparent)}
.ornament-cross{color:var(--sc,#B8860B);font-size:20px;font-family:serif}

.readings-title{

  color:#2D0A1E;letter-spacing:.04em;margin-bottom:20px;text-align:center;line-height:1.3;

.readings-list{display:flex;flex-direction:column;gap:12px}

/* ── READING CARD ── */
.card{

  border-radius:8px;overflow:hidden;transition:box-shadow .2s;
}
.card.gospel{background:#fdf8ee;border-left:4px solid var(--sc,#B8860B)}
.card-inner{padding:16px 18px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-label-wrap{flex:1}
.label-badge{
  display:inline-block;font-size:11px;font-family:'Cinzel',Georgia,serif;
  letter-spacing:.12em;text-transform:uppercase;
  padding:2px 8px;border-radius:3px;margin-bottom:6px;

.label-badge.gospel{color:var(--sc,#B8860B);background:var(--sc-bg,rgba(184,134,11,.13))}
.label-badge.other{color:#6b5c3e;background:#f0e8d8}

.card-actions{display:flex;gap:6px;flex-shrink:0;margin-top:4px;flex-wrap:wrap}
.read-btn{
  padding:6px 12px;border-radius:20px;cursor:pointer;
  font-size:12px;font-family:'Cinzel',Georgia,serif;letter-spacing:.05em;
  transition:all .2s;white-space:nowrap;

.read-btn.closed{background:transparent;color:var(--sc,#B8860B)}

.hr-btn{
  padding:6px 12px;background:transparent;color:#8B6914;
  border:1.5px solid #c9a96e;border-radius:20px;
  font-size:12px;font-family:'Cinzel',Georgia,serif;letter-spacing:.05em;
  text-decoration:none;white-space:nowrap;

.card-text{
  margin-top:14px;padding-top:14px;
  border-top:1px dashed var(--sc-border,rgba(184,134,11,.27));
  font-size:16px;line-height:1.85;
  font-family:'EB Garamond',Georgia,serif;color:#2c1a0e;white-space:pre-wrap;
}
.card-text-meta{
  font-size:11px;font-family:'Cinzel',Georgia,serif;color:#999;
  letter-spacing:.1em;margin-bottom:10px;text-transform:uppercase;
}
.card-error{color:#c00;font-size:13px;margin-top:8px;font-style:italic}

/* ── TIP ── */
.tip{
  margin-top:28px;padding:12px 16px;
  background:var(--sc-bg,rgba(184,134,11,.07));
  border:1px solid var(--sc-border,rgba(184,134,11,.2));
  border-radius:8px;font-size:13px;color:#6b5c3e;font-style:italic;text-align:center;

/* ── EMPTY STATE ── */
.empty{

  border-radius:10px;padding:32px 24px;text-align:center;color:#6b5c3e;

.empty-icon{font-size:36px;margin-bottom:12px}
.empty-msg{font-family:'EB Garamond',Georgia,serif;font-size:16px;line-height:1.7;font-style:italic}
.empty-links{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.link-primary{

.link-secondary{
  padding:8px 16px;background:transparent;color:var(--sc,#B8860B);

  text-decoration:none;font-size:13px;font-family:'Cinzel',Georgia,serif;letter-spacing:.06em;

/* ── META FOOTER ── */
.meta-cards{

  border-top:1px solid var(--sc-border,rgba(184,134,11,.2));

/* ── YEAR WARNING ── */
.year-warn{
  background:#fff8e7;border:1px solid #e8c97a;border-radius:8px;

@media(max-width:480px){

// HELPERS
// ════════════════════════════════════════════
function getEaster(year){
  const a=year%19,b=Math.floor(year/100),c=year%100;
  const d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4;
  const l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
  return new Date(year,month-1,day);
}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function getAdventStart(year){const nov27=new Date(year,10,27);const dow=nov27.getDay();return dow===0?nov27:addDays(nov27,7-dow)}

// ════════════════════════════════════════════
// LITURGICAL CALENDAR RESOLVER
// ════════════════════════════════════════════
function getLiturgicalInfo(date){
  const year=date.getFullYear();
  const adventThisYear=getAdventStart(year);
  const lYear=date>=adventThisYear?year:year-1;
  const cycleNum=((lYear-2022)%3+3)%3;
  const yearCycle=['A','B','C'][cycleNum];
  const weekdayCycle=(year%2!==0)?'I':'II';
  const ms=7*24*3600*1000;

  const advent1=getAdventStart(lYear);
  const christmas=new Date(lYear,11,25);
  const easter=getEaster(lYear+1);
  const epiphany=new Date(lYear+1,0,6);
  const epDow=epiphany.getDay();
  const baptism=addDays(epiphany,epDow===0?7:7-epDow);
  const ashWed=addDays(easter,-46);
  const palmSunday=addDays(easter,-7);
  const holyThursday=addDays(easter,-3);
  const goodFriday=addDays(easter,-2);
  const holySaturday=addDays(easter,-1);
  const ascension=addDays(easter,42);
  const pentecost=addDays(easter,49);
  const nextAdvent=getAdventStart(lYear+1);
  const isSun=date.getDay()===0;

  // ── Fixed feasts ──
  if(sameDay(date,christmas)) return{title:"Božić",season:'christmas',day:'nativity',yearCycle,weekdayCycle,color:SEASON_COLORS.christmas,isSunday:true};
  if(date.getMonth()===0&&date.getDate()===1) return{title:"Marija, Majka Božja",season:'christmas',day:'maryMotherOfGod',yearCycle,weekdayCycle,color:SEASON_COLORS.christmas,isSunday:false};
  if(sameDay(date,epiphany)) return{title:"Bogojavljenje",season:'christmas',day:'epiphany',yearCycle,weekdayCycle,color:SEASON_COLORS.christmas,isSunday:true};
  if(sameDay(date,baptism)) return{title:"Krštenje Gospodinovo",season:'christmas',day:'baptism',yearCycle,weekdayCycle,color:SEASON_COLORS.christmas,isSunday:true};
  if(sameDay(date,ashWed)) return{title:"Pepelnica",season:'lent',day:'ashWednesday',yearCycle,weekdayCycle,color:SEASON_COLORS.lent,isSunday:false};
  if(sameDay(date,palmSunday)) return{title:"Cvjetnica",season:'lent',day:'palmSunday',week:6,yearCycle,weekdayCycle,color:'#B22222',isSunday:true};
  if(sameDay(date,holyThursday)) return{title:"Veliki četvrtak",season:'holyWeek',day:'holyThursday',yearCycle,weekdayCycle,color:SEASON_COLORS.holyWeek,isSunday:false};
  if(sameDay(date,goodFriday)) return{title:"Veliki petak",season:'holyWeek',day:'goodFriday',yearCycle,weekdayCycle,color:'#B22222',isSunday:false};
  if(sameDay(date,holySaturday)) return{title:"Velika subota",season:'holyWeek',day:'holySaturday',yearCycle,weekdayCycle,color:SEASON_COLORS.holyWeek,isSunday:false};
  if(sameDay(date,easter)) return{title:"Uskrsna nedjelja",season:'easter',week:1,yearCycle,weekdayCycle,color:SEASON_COLORS.easter,isSunday:true};
  if(sameDay(date,ascension)) return{title:"Uzašašće Gospodinovo",season:'easter',week:7,day:'ascension',yearCycle,weekdayCycle,color:SEASON_COLORS.easter,isSunday:false};
  if(sameDay(date,pentecost)) return{title:"Duhovi",season:'easter',week:9,day:'pentecost',yearCycle,weekdayCycle,color:'#B22222',isSunday:true};

  // Holy Family — first Sunday after Christmas
  for(let i=26;i<=31;i++){
    const c=new Date(lYear,11,i);
    if(c.getDay()===0&&sameDay(date,c)) return{title:"Sveta Obitelj",season:'christmas',day:'holyFamily',yearCycle,weekdayCycle,color:SEASON_COLORS.christmas,isSunday:true};
  }

  // ── ADVENT ──
  if(date>=advent1&&date<christmas){
    const w=Math.min(Math.floor((date-advent1)/ms)+1,4);
    return{title:`${w}. nedjelja došašća`,season:'advent',week:w,yearCycle,weekdayCycle,color:SEASON_COLORS.advent,isSunday:isSun};
  }
  // ── CHRISTMAS TIME (Dec 26 → Baptism) ──
  if(date>christmas&&date<baptism){
    return{title:"Božićno vrijeme",season:'christmas',day:'octave',yearCycle,weekdayCycle,color:SEASON_COLORS.christmas,isSunday:isSun};
  }
  // ── ORDINARY I (Baptism → Ash Wednesday) ──
  if(date>baptism&&date<ashWed){
    const botDow=baptism.getDay();
    const firstOTSun=addDays(baptism,botDow===0?7:7-botDow);
    if(isSun&&date>=firstOTSun){
      const w=Math.floor((date-firstOTSun)/ms)+2;
      return{title:`${w}. nedjelja kroz godinu`,season:'ordinary',week:w,yearCycle,weekdayCycle,color:SEASON_COLORS.ordinary,isSunday:true};
    }
    if(!isSun&&date>=firstOTSun){
      const w=Math.floor((date-firstOTSun)/ms)+2;
      return{title:`${w}. tjedan kroz godinu`,season:'ordinary',week:w,yearCycle,weekdayCycle,color:SEASON_COLORS.ordinary,isSunday:false};
    }
    return{title:"Kroz godinu",season:'ordinary',yearCycle,weekdayCycle,color:SEASON_COLORS.ordinary,isSunday:false};
  }
  // ── LENT (Ash Wednesday + 1 → Palm Sunday) ──
  if(date>ashWed&&date<palmSunday){
    const ashDow=ashWed.getDay();
    const lent1Sun=addDays(ashWed,ashDow===0?7:7-ashDow);
    if(isSun&&date>=lent1Sun){
      const w=Math.floor((date-lent1Sun)/ms)+1;
      return{title:`${w}. nedjelja korizme`,season:'lent',week:w,yearCycle,weekdayCycle,color:SEASON_COLORS.lent,isSunday:true};
    }
    return{title:"Korizma",season:'lent',yearCycle,weekdayCycle,color:SEASON_COLORS.lent,isSunday:false};
  }
  // ── HOLY WEEK ──
  if(date>=palmSunday&&date<easter){
    return{title:"Sveti tjedan",season:'holyWeek',yearCycle,weekdayCycle,color:SEASON_COLORS.holyWeek,isSunday:false};
  }
  // ── EASTER TIME (Easter+1 → Pentecost) ──
  if(date>easter&&date<pentecost){
    const w=Math.floor((date-easter)/ms)+1;
    if(isSun) return{title:`${w}. uskrsna nedjelja`,season:'easter',week:w,yearCycle,weekdayCycle,color:SEASON_COLORS.easter,isSunday:true};
    return{title:"Uskrsno vrijeme",season:'easter',week:w,yearCycle,weekdayCycle,color:SEASON_COLORS.easter,isSunday:false};
  }
  // ── ORDINARY II (Pentecost+1 → Advent) ──
  if(date>pentecost&&date<nextAdvent){
    const botDow2=baptism.getDay();
    const firstOTSun2=addDays(baptism,botDow2===0?7:7-botDow2);
    const ashDow2=ashWed.getDay();
    const lastOT1Sun=addDays(ashWed,-(ashDow2===0?7:ashDow2));
    const lastOT1Week=Math.floor((lastOT1Sun-firstOTSun2)/ms)+2;
    const pentDow=pentecost.getDay();
    const firstOT2Sun=addDays(pentecost,pentDow===0?7:7-pentDow);
    if(isSun&&date>=firstOT2Sun){
      const wFromStart=Math.floor((date-firstOT2Sun)/ms);
      const w=Math.min(lastOT1Week+1+wFromStart,34);
      return{title:`${w}. nedjelja kroz godinu`,season:'ordinary',week:w,yearCycle,weekdayCycle,color:SEASON_COLORS.ordinary,isSunday:true};
    }
    if(!isSun&&date>=firstOT2Sun){
      const wFromStart=Math.floor((date-firstOT2Sun)/ms);
      const w=Math.min(lastOT1Week+1+wFromStart,34);
      return{title:`${w}. tjedan kroz godinu`,season:'ordinary',week:w,yearCycle,weekdayCycle,color:SEASON_COLORS.ordinary,isSunday:false};
    }
    return{title:"Kroz godinu",season:'ordinary',yearCycle,weekdayCycle,color:SEASON_COLORS.ordinary,isSunday:false};
  }
  return{title:"—",season:'ordinary',yearCycle,weekdayCycle,color:SEASON_COLORS.ordinary,isSunday:false};
}

function getReadings(lit){
  const L=LECT_A;
  const{season,day,week,isSunday}=lit;
  if(season==='advent'&&isSunday&&week>=1&&week<=4) return L.advent[week-1];
  if(season==='christmas'){
    if(day==='nativity') return L.christmas.nativity;
    if(day==='holyFamily') return L.christmas.holyFamily;
    if(day==='maryMotherOfGod') return L.christmas.maryMotherOfGod;
    if(day==='epiphany') return L.christmas.epiphany;
    if(day==='baptism') return L.christmas.baptism;
  }
  if(season==='lent'){
    if(day==='ashWednesday') return L.lent[0];
    if(day==='palmSunday') return L.lent[6];
    if(isSunday&&week>=1&&week<=5) return L.lent[week];
  }
  if(season==='holyWeek'){
    if(day==='holyThursday') return L.holyWeek.holyThursday;
    if(day==='goodFriday') return L.holyWeek.goodFriday;
    if(day==='holySaturday') return L.holyWeek.holySaturday;
  }
  if(season==='easter'){
    if(day==='ascension') return L.easter[6];
    if(day==='pentecost') return L.easter[8];
    if(isSunday&&week>=1&&week<=8) return L.easter[week-1];
  }
  if(season==='ordinary'&&isSunday&&week>=2&&week<=34) return L.ordinary[week-1];
  return null;
}

function bibleComUrl(bcId){return`https://www.bible.com/hr/bible/164/${bcId}.NTLH`}

// ════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════
const TODAY=new Date();
let state={date:new Date(TODAY)};
const expandedText={};

function setState(patch){Object.assign(state,patch);render()}

// ════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════
function render(){
  const lit=getLiturgicalInfo(state.date);
  const readings=getReadings(lit);
  const sc=lit.color;
  const isToday=sameDay(state.date,TODAY);
  const seasonName=SEASON_NAMES[lit.season]||'Kroz godinu';
  const glyph=lit.season==='easter'?'☩':'✝';

  // Update CSS variables
  document.documentElement.style.setProperty('--sc',sc);
  document.documentElement.style.setProperty('--sc-t',sc+'cc');
  document.documentElement.style.setProperty('--sc-bg',sc+'1a');
  document.documentElement.style.setProperty('--sc-border',sc+'44');
  document.documentElement.style.setProperty('--sc-border2',sc+'66');

  document.getElementById('app').innerHTML=`
    <header>
      <div class="cross-pulse">${glyph}</div>
      <h1 class="header-title">Dnevna misna čitanja</h1>
      <p class="header-sub">Rimokatolički red čitanja · Godina ${lit.yearCycle} · ${seasonName}</p>
      <div class="season-badge"><span class="season-dot"></span>${seasonName.toUpperCase()}</div>
    </header>

    <nav>
      <button class="nav-btn" onclick="go(-7)" title="Prethodna nedjelja">◀◀</button>
      <button class="nav-btn" onclick="go(-1)" title="Prethodni dan">◀</button>
      <div class="nav-date">
        <div class="nav-date-str">${formatDateHR(state.date)}</div>
        <div class="nav-date-lit">${lit.title}</div>
      </div>
      <button class="nav-btn" onclick="go(1)" title="Sljedeći dan">▶</button>
      <button class="nav-btn" onclick="go(7)" title="Sljedeća nedjelja">▶▶</button>
      ${!isToday?`<button class="today-btn" onclick="goToday()">DANAS</button>`:''}
    </nav>

    <main>
      <div class="ornament">
        <span class="ornament-line"></span>
        <span class="ornament-cross">${glyph}</span>
        <span class="ornament-line"></span>
      </div>

      ${readings ? renderReadings(readings, lit) : renderEmpty(lit)}

      <div class="meta-cards">
        ${[['Liturgijska godina',`Godina ${lit.yearCycle}`],['Čitanja kroz tjedan',`Godina ${lit.weekdayCycle}`],['Sezona',seasonName]].map(([l,v])=>`
          <div class="meta-card">
            <div class="meta-label">${l}</div>
            <div class="meta-value">${v}</div>
          </div>`).join('')}
      </div>

      <details style="margin-top:24px">
        <summary class="about-summary">ℹ️ O aplikaciji</summary>
        <div class="about-body">
          <p><strong>Čitanja su kodirana za:</strong> Godinu A (Došašće 2025 – Krist Kralj 2026)</p>
          <p><strong>U pripremi:</strong> Godina B (Došašće 2026 →) i Godina C</p>
          <p><strong>Tekst čitanja:</strong> World English Bible (javna domena) putem <em>bible-api.com</em></p>
          <p><strong>Hrvatski prijevod:</strong> Klikni 🇭🇷 HR link pokraj svakog čitanja (Bible.com)</p>
          <p><strong>Liturgijski kalendar:</strong> Izračunava se automatski prema rimokatoličkom lekcionaru</p>
          <p style="margin-top:10px;font-size:12px;color:#aaa">GitHub Pages · Statička web aplikacija · Nema servera</p>
        </div>
      </details>
    </main>
  `;

  // Re-attach expand states (text already fetched)
  document.querySelectorAll('[data-card-idx]').forEach(btn=>{
    const idx=btn.dataset.cardIdx;
    if(expandedText[idx]!==undefined) restoreCard(idx);
  });
}

function renderReadings(readings,lit){
  const warn=lit.yearCycle!=='A'?`<div class="year-warn">ℹ️ Čitanja za Godinu ${lit.yearCycle} još nisu dodana. Privremeno se prikazuju čitanja Godine A.</div>`:'';
  const cards=readings.readings.map((r,i)=>{
    const key=`${state.date.toDateString()}-${i}`;
    const isGospel=r.label.toLowerCase().includes('evanđelje');
    return`<div class="card${isGospel?' gospel':''}" id="card-${i}">
      <div class="card-inner">
        <div class="card-top">
          <div class="card-label-wrap">
            <span class="label-badge ${isGospel?'gospel':'other'}">${r.label}</span>
            <div class="card-ref">${r.ref}</div>
          </div>
          <div class="card-actions">
            <button class="read-btn closed" data-card-idx="${i}" data-key="${key}" data-ref="${r.ref}" onclick="toggleCard(${i},'${r.ref}','${key}')">📖 Čitaj (EN)</button>
            <a class="hr-btn" href="${bibleComUrl(r.bcId)}" target="_blank" rel="noopener noreferrer">🇭🇷 HR</a>
          </div>
        </div>
        <div id="card-error-${i}" class="card-error" style="display:none"></div>
        <div id="card-text-${i}" class="card-text" style="display:none">
          <div class="card-text-meta">World English Bible (javna domena)</div>
          <div id="card-body-${i}"></div>
        </div>
      </div>
    </div>`;
  }).join('');
  return`<div class="reading-enter">
    <h2 class="readings-title">${readings.title}</h2>
    ${warn}
    <div class="readings-list">${cards}</div>
    <div class="tip">📖 Tekst se učitava na engleskom (World English Bible — javna domena). Za hrvatski prijevod, klikni <strong>🇭🇷 HR</strong> na svakom čitanju.</div>
  </div>`;
}

function renderEmpty(lit){
  const msg=!lit.isSunday
    ?`Ovaj dan (${DAYS_HR[state.date.getDay()]}) nema zaseban obrazac nedjeljna čitanja. Navigiraj do obližnje nedjelje ili blagdana.`
    :`Čitanja za Godinu ${lit.yearCycle} još nisu kodirana. Dostupna su samo čitanja Godine A (Došašće 2025 – Krist Kralj 2026).`;
  return`<div class="empty">
    <div class="empty-icon">${lit.isSunday?'📅':'🕯️'}</div>
    <p class="empty-msg">${msg}</p>
    <div class="empty-links">
      <a class="link-primary" href="https://www.hbk.hr/liturgija" target="_blank">HBK Liturgija →</a>
      <a class="link-secondary" href="https://www.laudato.hr/Molitva/Sveta-misa/Dnevna-citanja.aspx" target="_blank">Laudato.hr →</a>
    </div>
  </div>`;
}

// ════════════════════════════════════════════
// CARD TOGGLE / FETCH
// ════════════════════════════════════════════
const fetchCache={};
async function toggleCard(idx,ref,key){
  const btn=document.querySelector(`[data-card-idx="${idx}"]`);
  const textDiv=document.getElementById(`card-text-${idx}`);
  const errDiv=document.getElementById(`card-error-${idx}`);
  const bodyDiv=document.getElementById(`card-body-${idx}`);

  const isOpen=textDiv.style.display!=='none';
  if(isOpen){
    textDiv.style.display='none';
    btn.className='read-btn closed';
    btn.textContent='📖 Čitaj (EN)';
    return;
  }

  if(fetchCache[key]){
    bodyDiv.textContent=fetchCache[key];
    textDiv.style.display='block';
    btn.className='read-btn open';
    btn.textContent='✕ Zatvori';
    return;
  }

  btn.textContent='⏳';
  btn.disabled=true;
  errDiv.style.display='none';
  try{
    const res=await fetch(`https://bible-api.com/${encodeURIComponent(ref)}?translation=web`);
    const data=await res.json();
    if(data.error) throw new Error(data.error);
    fetchCache[key]=data.text||'(nema teksta)';
    bodyDiv.textContent=fetchCache[key];
    textDiv.style.display='block';
    btn.className='read-btn open';
    btn.textContent='✕ Zatvori';
  }catch(e){
    errDiv.textContent='Nije moguće učitati tekst. Provjerite internetsku vezu.';
    errDiv.style.display='block';
    btn.className='read-btn closed';
    btn.textContent='📖 Čitaj (EN)';
  }
  btn.disabled=false;
}

function restoreCard(idx){
  const key=`${state.date.toDateString()}-${idx}`;
  if(fetchCache[key]){
    const bodyDiv=document.getElementById(`card-body-${idx}`);
    const textDiv=document.getElementById(`card-text-${idx}`);
    const btn=document.querySelector(`[data-card-idx="${idx}"]`);
    if(bodyDiv){bodyDiv.textContent=fetchCache[key]}
    if(textDiv){textDiv.style.display='block'}
    if(btn){btn.className='read-btn open';btn.textContent='✕ Zatvori'}
  }
}

// ════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════
function go(days){const d=new Date(state.date);d.setDate(d.getDate()+days);setState({date:d})}
function goToday(){setState({date:new Date(TODAY)})}

// ════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════
render();
</script>
